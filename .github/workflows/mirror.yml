name: Mirror to Forgejo / Codeberg

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone bare repository and push mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_URL: ${{ vars.MIRROR_URL }}
          MIRROR_USER: ${{ vars.MIRROR_USER }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # Clone a clean bare mirror from GitHub
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@://github.com{{ github.repository }}.git" repo.git
          cd repo.git

          # Construct authenticated destination URL
          AUTH_URL=$(echo "$MIRROR_URL" | sed "s|https://|https://${MIRROR_USER}:${MIRROR_TOKEN}@|")

          # Force-push exact mirror to Codeberg / Forgejo
          git push --mirror "$AUTH_URL"
