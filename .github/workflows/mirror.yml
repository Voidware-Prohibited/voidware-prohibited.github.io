name: Mirror to Forgejo / Codeberg

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: roostorg/mirror@main
        with:
          destination: ${{ vars.MIRROR_URL }}
          token_username: ${{ vars.MIRROR_USER }}
          token: ${{ secrets.MIRROR_TOKEN }}
