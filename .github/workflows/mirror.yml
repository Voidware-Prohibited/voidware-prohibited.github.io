name: Mirror to Codeberg

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository to Codeberg
        uses: yesolutions/mirror-action@v0.7.0
        with:
          REMOTE: https://codeberg.org{{ vars.MIRROR_USER }}/${{ vars.MIRROR_REPO }}.git
          GIT_USERNAME: ${{ vars.MIRROR_USER }}
          GIT_PASSWORD: ${{ secrets.MIRROR_TOKEN }}
          GIT_PUSH_ARGS: --tags --force --prune
