<a class="site-brand-logo" rel="author" href="{{ "/" | relative_url }}">
  <img class="site-favicon" title="{{ site.title | escape }}" src="/assets/images/{{ site.glyph_filename }}" onerror="this.style.display='none'" alt="{{ site.title | escape }}">
</a>
<a class="site-brand-inner" rel="author" href="{{ "/" | relative_url }}" style="display: none;">
  {{ site.title | escape }}
</a>
